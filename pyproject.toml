[project]
name = "adjudicaciones-cv"
version = "0.0.0"
description = "Baseline reproducible para el análisis de adjudicaciones docentes"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0,<3.0",
    "numpy<2.3",
    "openpyxl>=3.1.0",
    "pypdf>=4.0.0",
    "rpds-py<1",
]

[project.optional-dependencies]
dev = [
    "pip-tools>=7.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-socket>=0.7.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --disable-socket"
testpaths = ["."]
python_files = ["test_*.py"]
markers = [
    "full_pdf: baseline lenta contra el PDF oficial completo",
]

[tool.coverage.run]
branch = true
source = [
    "adjudicacion",
    "bloques",
    "calcular_rutas",
    "match_coords",
    "parse_zones",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "artifacts",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
