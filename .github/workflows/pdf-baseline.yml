name: PDF baseline

on:
  workflow_dispatch:
  push:
    paths:
      - "lis_vac_adj_ini_26_27.pdf"
      - "adjudicacion.py"
      - "match_coords.py"
      - "municipios_cv.json"
      - "zonas.json"
      - "scripts/generate_pdf_baseline.py"
      - "test_pdf_baseline.py"
      - "tests/baselines/**"
      - "tests/fixtures/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/pdf-baseline.yml"
  pull_request:
    paths:
      - "lis_vac_adj_ini_26_27.pdf"
      - "adjudicacion.py"
      - "match_coords.py"
      - "municipios_cv.json"
      - "zonas.json"
      - "scripts/generate_pdf_baseline.py"
      - "test_pdf_baseline.py"
      - "tests/baselines/**"
      - "tests/fixtures/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/pdf-baseline.yml"

permissions:
  contents: read

jobs:
  full-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked development environment
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Verify official PDF baseline without network
        run: python -m pytest -m full_pdf
      - name: Upload structured baseline reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-baseline
          path: artifacts/baseline/
          if-no-files-found: error
